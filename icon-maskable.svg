<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg2" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#071525"/>
    </radialGradient>
    <radialGradient id="ball2" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#d5d5d5"/>
    </radialGradient>
    <radialGradient id="green2" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00803A"/>
      <stop offset="100%" stop-color="#004520"/>
    </radialGradient>
    <filter id="bs2">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full bleed background (maskable: content fills entire square, safe zone is inner 80%) -->
  <rect width="512" height="512" fill="url(#bg2)"/>

  <!-- Green field -->
  <path d="M0,360 L512,360 L512,512 L0,512 Z" fill="url(#green2)"/>

  <!-- Yellow stripe -->
  <rect x="0" y="352" width="512" height="14" fill="#F4D03F"/>
  <rect x="0" y="352" width="512" height="5" fill="rgba(255,255,255,0.22)"/>

  <!-- Ball shadow -->
  <ellipse cx="256" cy="354" rx="90" ry="12" fill="rgba(0,0,0,0.3)"/>

  <!-- Soccer ball (within safe zone) -->
  <circle cx="256" cy="200" r="116" fill="url(#ball2)" filter="url(#bs2)"/>

  <!-- Pentagon patches -->
  <path d="M256,97  L298,122 L284,168 L228,168 L214,122 Z" fill="#111" opacity="0.88"/>
  <path d="M214,122 L170,117 L148,160 L176,200 L214,168 Z" fill="#111" opacity="0.88"/>
  <path d="M298,122 L342,117 L364,160 L336,200 L298,168 Z" fill="#111" opacity="0.88"/>
  <path d="M176,200 L148,238 L168,280 L214,288 L232,246 L214,168 Z" fill="#111" opacity="0.88"/>
  <path d="M336,200 L364,238 L344,280 L298,288 L280,246 L298,168 Z" fill="#111" opacity="0.88"/>
  <path d="M232,246 L214,288 L256,306 L298,288 L280,246 L256,258 Z" fill="#111" opacity="0.88"/>

  <!-- Ball outline -->
  <circle cx="256" cy="200" r="116" fill="none" stroke="rgba(180,180,180,0.4)" stroke-width="2"/>

  <!-- "Bolão" text — within safe zone (y ≤ 460) -->
  <text x="256" y="432"
    font-size="80"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    fill="#F4D03F"
    text-anchor="middle"
    letter-spacing="-1">Bolão</text>

  <!-- "Copa 2026" — within safe zone -->
  <text x="256" y="474"
    font-size="24"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    letter-spacing="5">COPA 2026</text>
</svg>

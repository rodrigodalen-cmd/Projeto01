<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="100%" stop-color="#172B48"/>
    </linearGradient>
    <linearGradient id="gold2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="gold2b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE877"/>
      <stop offset="100%" stop-color="#C49A00"/>
    </linearGradient>
    <linearGradient id="inner2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142640"/>
      <stop offset="100%" stop-color="#091828"/>
    </linearGradient>
    <radialGradient id="ball2" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </radialGradient>
    <filter id="sh2a" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh2b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no clip for maskable) -->
  <rect width="512" height="512" fill="url(#bg2)"/>
  <!-- Subtle diagonal shimmer -->
  <line x1="0" y1="512" x2="512" y2="0" stroke="rgba(255,215,0,0.05)" stroke-width="80"/>

  <!-- Shield design scaled to 85% and centered for maskable safe zone -->
  <g transform="translate(256,256) scale(0.85) translate(-256,-256)">
    <!-- Shield outer (gold) -->
    <path d="M256,46 L406,72 L406,314 C406,406 330,452 256,474 C182,452 106,406 106,314 L106,72 Z"
          fill="url(#gold2)" filter="url(#sh2a)"/>

    <!-- Shield inner (dark) -->
    <path d="M256,66 L388,90 L388,312 C388,394 320,436 256,456 C192,436 124,394 124,312 L124,90 Z"
          fill="url(#inner2)"/>

    <!-- Top gold band -->
    <path d="M124,90 L388,90 L388,152 L124,152 Z" fill="url(#gold2)"/>
    <line x1="124" y1="152" x2="388" y2="152" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>

    <!-- BOLÃO text in top band -->
    <text x="256" y="135"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="32" font-weight="900" fill="#0B1A2E"
      text-anchor="middle" letter-spacing="5">BOLÃO</text>

    <!-- Soccer ball -->
    <circle cx="256" cy="268" r="80" fill="url(#ball2)" filter="url(#sh2b)"/>
    <!-- Ball patches (Telstar, scaled to r=80 centered at 268) -->
    <g transform="translate(256,268) scale(0.5333) translate(-256,-292)">
      <path d="M256,155 L304,184 L288,242 L224,242 L208,184Z" fill="#111" opacity="0.85"/>
      <path d="M208,184 L158,177 L133,228 L168,277 L208,242Z" fill="#111" opacity="0.85"/>
      <path d="M304,184 L354,177 L379,228 L344,277 L304,242Z" fill="#111" opacity="0.85"/>
      <path d="M168,277 L133,322 L158,371 L215,381 L238,335 L208,242Z" fill="#111" opacity="0.85"/>
      <path d="M344,277 L379,322 L354,371 L297,381 L274,335 L304,242Z" fill="#111" opacity="0.85"/>
      <path d="M238,335 L215,381 L256,399 L297,381 L274,335 L256,348Z" fill="#111" opacity="0.85"/>
    </g>
    <circle cx="256" cy="268" r="80" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
    <!-- Ball shine -->
    <circle cx="226" cy="226" r="18" fill="rgba(255,255,255,0.28)"/>

    <!-- FC text (gold, large) -->
    <text x="256" y="424"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="68" font-weight="900" fill="url(#gold2b)"
      text-anchor="middle" letter-spacing="8"
      filter="url(#glow2)">FC</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="110"/></clipPath>

    <!-- Background gradient - green field -->
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a472a"/>
      <stop offset="100%" stop-color="#0a2010"/>
    </radialGradient>

    <!-- Ball white base -->
    <radialGradient id="ball" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </radialGradient>

    <!-- Ball glow -->
    <filter id="ball_sh" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- Text shadow -->
    <filter id="txt_sh">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <filter id="gold_glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g clip-path="url(#r)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Subtle field lines -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

    <!-- BOLÃO FC label top -->
    <text x="256" y="68"
      font-family="'Arial Black','Impact',sans-serif"
      font-size="42" font-weight="900"
      fill="url(#gold)"
      text-anchor="middle"
      letter-spacing="4"
      filter="url(#txt_sh)">BOLÃO FC</text>

    <!-- ── Soccer ball ── -->
    <!-- Shadow/glow underneath -->
    <ellipse cx="258" cy="318" rx="130" ry="24" fill="rgba(0,0,0,0.35)"/>

    <!-- Ball base -->
    <circle cx="256" cy="274" r="148" fill="url(#ball)" filter="url(#ball_sh)"/>

    <!-- Classic Telstar patch pattern, scaled and centered -->
    <g transform="translate(256,274)">
      <!-- Center pentagon (top) -->
      <polygon points="0,-62 36,-37 22,10 -22,10 -36,-37"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Upper-right hex -->
      <polygon points="36,-37 80,-50 96,-10 72,28 36,14 22,10"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
      <!-- Upper-right pent -->
      <polygon points="80,-50 120,-66 138,-30 116,4 96,-10"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Right hex -->
      <polygon points="96,-10 116,4 110,48 80,66 52,44 72,28"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
      <!-- Lower-right pent -->
      <polygon points="110,48 130,80 108,114 72,112 52,78 80,66"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Bottom-right hex -->
      <polygon points="52,44 80,66 72,112 36,124 14,94 22,52"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
      <!-- Bottom pent -->
      <polygon points="36,124 54,148 0,158 -54,148 -36,124"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Bottom-left hex -->
      <polygon points="-22,52 -36,124 -54,148 -80,124 -72,78 -52,44"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
      <!-- Lower-left pent -->
      <polygon points="-110,48 -80,66 -72,112 -108,114 -130,80"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Left hex -->
      <polygon points="-96,-10 -72,28 -52,44 -80,66 -110,48 -116,4"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
      <!-- Upper-left pent -->
      <polygon points="-80,-50 -36,-37 -22,10 -36,14 -72,28 -96,-10 -116,4 -138,-30 -120,-66"
        fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

      <!-- Upper-left hex -->
      <polygon points="-80,-50 -36,-37 0,-62 36,-37 80,-50 68,-90 0,-108 -68,-90"
        fill="#fff" stroke="#ccc" stroke-width="1"/>
    </g>

    <!-- Ball rim -->
    <circle cx="256" cy="274" r="148" fill="none" stroke="rgba(80,80,80,0.2)" stroke-width="2"/>

    <!-- Highlight / shine -->
    <ellipse cx="210" cy="210" rx="42" ry="28" fill="rgba(255,255,255,0.32)" transform="rotate(-30,210,210)"/>
    <ellipse cx="224" cy="224" rx="16" ry="10" fill="rgba(255,255,255,0.18)" transform="rotate(-30,224,224)"/>

    <!-- Bottom label -->
    <text x="256" y="466"
      font-family="'Arial Black','Impact',sans-serif"
      font-size="30" font-weight="900"
      fill="rgba(255,215,0,0.85)"
      text-anchor="middle"
      letter-spacing="6"
      filter="url(#txt_sh)">COPA 2026</text>
  </g>
</svg>

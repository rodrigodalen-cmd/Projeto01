<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="100"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#061020"/>
    </linearGradient>
    <radialGradient id="glow_c" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#061020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball_grad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
    <radialGradient id="ball_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C8960A"/>
    </linearGradient>
    <linearGradient id="green_band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a040"/>
      <stop offset="100%" stop-color="#006B28"/>
    </linearGradient>
    <filter id="ball_sh">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="txt_sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="gold_glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.7"/>
    </filter>
    <filter id="top_glow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFD700" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#r)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow_c)"/>

    <!-- Subtle arc lines (stadium feel) -->
    <ellipse cx="256" cy="560" rx="340" ry="280" fill="none" stroke="rgba(0,160,64,0.08)" stroke-width="2"/>
    <ellipse cx="256" cy="560" rx="280" ry="220" fill="none" stroke="rgba(0,160,64,0.06)" stroke-width="2"/>

    <!-- Top gold accent bar -->
    <rect x="0" y="0" width="512" height="10" fill="url(#gold)" filter="url(#top_glow)"/>

    <!-- Stars row -->
    <g fill="url(#gold)" filter="url(#gold_glow)" opacity="0.9">
      <polygon points="256,36 261,51 277,51 264,60 269,76 256,67 243,76 248,60 235,51 251,51" transform="scale(0.7) translate(-112,-14)"/>
      <polygon points="256,36 261,51 277,51 264,60 269,76 256,67 243,76 248,60 235,51 251,51" transform="scale(0.7) translate(-38,-14)"/>
      <polygon points="256,36 261,51 277,51 264,60 269,76 256,67 243,76 248,60 235,51 251,51" transform="scale(0.7) translate(36,-14)"/>
      <polygon points="256,36 261,51 277,51 264,60 269,76 256,67 243,76 248,60 235,51 251,51" transform="scale(0.7) translate(110,-14)"/>
      <polygon points="256,36 261,51 277,51 264,60 269,76 256,67 243,76 248,60 235,51 251,51" transform="scale(0.7) translate(184,-14)"/>
    </g>

    <!-- Green band -->
    <rect x="0" y="88" width="512" height="64" fill="url(#green_band)"/>
    <rect x="0" y="88" width="512" height="2" fill="rgba(255,215,0,0.5)"/>
    <rect x="0" y="150" width="512" height="2" fill="rgba(255,215,0,0.5)"/>

    <!-- BOLÃO FC text in green band -->
    <text x="256" y="134"
      font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
      font-size="46" font-weight="900" fill="#FFD700"
      text-anchor="middle" letter-spacing="6"
      filter="url(#txt_sh)">BOLÃO FC</text>

    <!-- Soccer ball -->
    <circle cx="256" cy="302" r="118" fill="url(#ball_grad)" filter="url(#ball_sh)"/>

    <!-- Ball pentagon/hexagon patches (Jabulani-style) -->
    <!-- Center pentagon -->
    <polygon points="256,247 280,264 271,292 241,292 232,264"
      fill="#111" opacity="0.82"/>
    <!-- Top -->
    <polygon points="256,218 280,232 280,247 256,247 232,247 232,232"
      fill="#111" opacity="0.82"/>
    <!-- Top-right -->
    <polygon points="280,232 308,220 320,248 308,268 280,264 280,247"
      fill="#111" opacity="0.82"/>
    <!-- Bottom-right -->
    <polygon points="308,268 328,292 316,318 291,318 271,292 280,264"
      fill="#111" opacity="0.82"/>
    <!-- Bottom -->
    <polygon points="291,318 316,318 308,342 256,352 204,342 196,318 221,318"
      fill="#111" opacity="0.82"/>
    <!-- Bottom-left -->
    <polygon points="204,342 196,318 184,292 204,268 232,264 241,292 221,318"
      fill="#111" opacity="0.82"/>
    <!-- Top-left -->
    <polygon points="184,292 184,268 204,268 232,264 232,247 208,232 184,248"
      fill="#111" opacity="0.82"/>

    <!-- Ball edge shadow -->
    <circle cx="256" cy="302" r="118" fill="url(#ball_shadow)"/>
    <!-- Ball rim -->
    <circle cx="256" cy="302" r="118" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
    <!-- Ball shine -->
    <ellipse cx="218" cy="258" rx="26" ry="16" fill="rgba(255,255,255,0.35)" transform="rotate(-20,218,258)"/>
    <ellipse cx="230" cy="268" rx="10" ry="6" fill="rgba(255,255,255,0.18)" transform="rotate(-20,230,268)"/>

    <!-- Bottom gold bar -->
    <rect x="0" y="446" width="512" height="66" fill="url(#green_band)" opacity="0.85"/>
    <rect x="0" y="446" width="512" height="2" fill="rgba(255,215,0,0.4)"/>

    <!-- Bottom tagline -->
    <text x="256" y="490"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="22" font-weight="700" fill="rgba(255,215,0,0.9)"
      text-anchor="middle" letter-spacing="4">COPA 2026</text>

    <!-- Bottom gold line -->
    <rect x="0" y="508" width="512" height="4" fill="url(#gold)"/>
  </g>
</svg>

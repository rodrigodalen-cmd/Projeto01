<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="96"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6e2e"/>
      <stop offset="100%" stop-color="#1a9640"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c8960c"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8960c"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c8960c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="sh">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#r)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Diagonal shine overlay -->
    <rect width="512" height="512" fill="url(#shine)"/>
    <!-- Subtle field lines -->
    <circle cx="256" cy="600" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

    <!-- ===== TROPHY ===== -->
    <!-- Glow halo -->
    <ellipse cx="256" cy="260" rx="160" ry="140" fill="rgba(255,215,0,0.08)" filter="url(#glow)"/>

    <!-- Handles -->
    <path d="M168,160 Q118,160 118,215 Q118,268 168,272" fill="none" stroke="url(#goldH)" stroke-width="26" stroke-linecap="round" filter="url(#sh2)"/>
    <path d="M344,160 Q394,160 394,215 Q394,268 344,272" fill="none" stroke="url(#goldH)" stroke-width="26" stroke-linecap="round" filter="url(#sh2)"/>

    <!-- Cup body -->
    <path d="M168,118 L168,258 Q168,296 256,300 Q344,296 344,258 L344,118 Z" fill="url(#gold)" filter="url(#sh)"/>
    <!-- Top rim -->
    <rect x="158" y="106" width="196" height="22" rx="11" fill="#ffe566"/>
    <!-- Cup shine -->
    <path d="M190,124 L210,124 L206,290 L190,286 Z" fill="rgba(255,255,255,0.22)" rx="4"/>
    <!-- Inner shadow at bottom of cup -->
    <path d="M190,270 Q256,285 322,270 L322,258 Q256,273 190,258 Z" fill="rgba(0,0,0,0.1)"/>

    <!-- Stem -->
    <rect x="232" y="300" width="48" height="40" rx="6" fill="url(#gold)"/>
    <rect x="238" y="300" width="14" height="40" fill="rgba(255,230,0,0.35)"/>

    <!-- Base -->
    <rect x="188" y="336" width="136" height="20" rx="10" fill="#ffe566" filter="url(#sh2)"/>
    <rect x="176" y="352" width="160" height="18" rx="9" fill="url(#gold)" filter="url(#sh2)"/>
    <!-- Base shine -->
    <rect x="192" y="355" width="60" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>

    <!-- ===== SOCCER BALL (inside cup) ===== -->
    <circle cx="256" cy="218" r="52" fill="#f0f0f0" opacity="0.92"/>
    <circle cx="256" cy="218" r="52" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
    <!-- Ball patches -->
    <path d="M256,172 L272,183 L267,203 L245,203 L240,183Z" fill="#111" opacity="0.75"/>
    <path d="M240,183 L222,181 L214,198 L226,213 L240,203Z" fill="#111" opacity="0.75"/>
    <path d="M272,183 L290,181 L298,198 L286,213 L272,203Z" fill="#111" opacity="0.75"/>
    <path d="M226,213 L214,228 L222,244 L240,248 L248,234 L240,203Z" fill="#111" opacity="0.75"/>
    <path d="M286,213 L298,228 L290,244 L272,248 L264,234 L272,203Z" fill="#111" opacity="0.75"/>
    <path d="M248,234 L240,248 L256,256 L272,248 L264,234 L256,240Z" fill="#111" opacity="0.75"/>
    <!-- Ball shine -->
    <circle cx="243" cy="203" r="11" fill="rgba(255,255,255,0.45)"/>

    <!-- ===== 3 STARS ===== -->
    <g filter="url(#sh2)">
      <!-- Left star -->
      <g transform="translate(166,72) scale(0.78)">
        <polygon points="0,-32 7.2,-10 30,-10 12.5,3.5 19.5,25 0,13 -19.5,25 -12.5,3.5 -30,-10 -7.2,-10" fill="#ffd700"/>
      </g>
      <!-- Center star (bigger) -->
      <g transform="translate(256,60)">
        <polygon points="0,-36 8.2,-11 34,-11 14,4 22,28 0,14.5 -22,28 -14,4 -34,-11 -8.2,-11" fill="#ffe566"/>
      </g>
      <!-- Right star -->
      <g transform="translate(346,72) scale(0.78)">
        <polygon points="0,-32 7.2,-10 30,-10 12.5,3.5 19.5,25 0,13 -19.5,25 -12.5,3.5 -30,-10 -7.2,-10" fill="#ffd700"/>
      </g>
    </g>

    <!-- Bottom text -->
    <text x="256" y="464"
      font-size="52" font-family="'Arial Black',Arial,sans-serif" font-weight="900"
      fill="#ffd700" text-anchor="middle" letter-spacing="-1"
      style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">BOLÃO</text>
    <text x="256" y="490"
      font-size="20" font-family="Arial,sans-serif" font-weight="700"
      fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="5">COPA 2026</text>
  </g>
</svg>

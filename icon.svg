<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="app"><rect width="512" height="512" rx="100"/></clipPath>
    <clipPath id="bc"><circle cx="256" cy="272" r="136"/></clipPath>

    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1b3a2a"/>
      <stop offset="100%" stop-color="#071510"/>
    </radialGradient>
    <radialGradient id="ball" cx="36%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#b8b8b8"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#A87000"/>
    </linearGradient>

    <filter id="bsh">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="tsh">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="gglow">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFD700" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g clip-path="url(#app)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Stars top -->
    <g fill="#FFD700" opacity="0.85" filter="url(#gglow)">
      <polygon points="176,52 180,64 193,64 183,72 187,84 176,76 165,84 169,72 159,64 172,64" transform="scale(0.85) translate(-26,4)"/>
      <polygon points="256,46 261,60 276,60 265,69 269,83 256,74 243,83 247,69 236,60 251,60"/>
      <polygon points="336,52 340,64 353,64 343,72 347,84 336,76 325,84 329,72 319,64 332,64" transform="scale(0.85) translate(54,4)"/>
    </g>

    <!-- BOLÃO FC -->
    <text x="256" y="118"
      font-family="'Arial Black','Impact',sans-serif"
      font-size="52" font-weight="900"
      fill="url(#gold)"
      text-anchor="middle"
      letter-spacing="3"
      filter="url(#tsh)">BOLÃO FC</text>

    <!-- Ball shadow on ground -->
    <ellipse cx="258" cy="422" rx="118" ry="14" fill="rgba(0,0,0,0.35)"/>

    <!-- Ball base -->
    <circle cx="256" cy="272" r="136" fill="url(#ball)" filter="url(#bsh)"/>

    <!-- Black patches clipped to ball -->
    <g clip-path="url(#bc)" fill="#111111">
      <!-- Top center pentagon -->
      <polygon points="256,136 305,171 287,228 225,228 207,171"/>
      <!-- Upper-right pentagon -->
      <polygon points="305,171 366,160 392,216 360,264 300,252 287,228"/>
      <!-- Upper-left pentagon (mirror) -->
      <polygon points="207,171 146,160 120,216 152,264 212,252 225,228"/>
      <!-- Lower-right pentagon -->
      <polygon points="360,264 400,308 378,368 318,376 290,322 300,252"/>
      <!-- Lower-left pentagon (mirror) -->
      <polygon points="152,264 112,308 134,368 194,376 222,322 212,252"/>
      <!-- Bottom pentagon -->
      <polygon points="222,322 194,376 234,408 278,408 318,376 290,322"/>
    </g>

    <!-- Ball edge ring -->
    <circle cx="256" cy="272" r="136" fill="none" stroke="rgba(0,0,0,0.13)" stroke-width="3"/>

    <!-- Shine highlight -->
    <ellipse cx="210" cy="218" rx="36" ry="22" fill="rgba(255,255,255,0.32)" transform="rotate(-30,210,218)"/>
    <ellipse cx="222" cy="230" rx="14" ry="8" fill="rgba(255,255,255,0.18)" transform="rotate(-30,222,230)"/>

    <!-- COPA 2026 -->
    <text x="256" y="472"
      font-family="'Arial Black','Impact',sans-serif"
      font-size="32" font-weight="900"
      fill="url(#gold)"
      text-anchor="middle"
      letter-spacing="5"
      filter="url(#tsh)">COPA 2026</text>
  </g>
</svg>

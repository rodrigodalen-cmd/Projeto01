<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="90"/></clipPath>
    <radialGradient id="ballG" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </radialGradient>
    <linearGradient id="cupG" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="stemG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A07800"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#A07800"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#r)">
    <!-- Green upper-left -->
    <polygon points="0,0 512,0 0,512" fill="#27A84A"/>
    <!-- Yellow lower-right -->
    <polygon points="512,0 512,512 0,512" fill="#F5C518"/>
    <!-- Diagonal highlight -->
    <line x1="0" y1="512" x2="512" y2="0" stroke="rgba(255,255,255,0.18)" stroke-width="28"/>

    <!-- Ball shadow -->
    <ellipse cx="256" cy="436" rx="125" ry="16" fill="rgba(0,0,0,0.22)"/>

    <!-- Soccer ball -->
    <circle cx="256" cy="292" r="150" fill="url(#ballG)" filter="url(#sh)"/>
    <!-- Patches (Telstar) -->
    <path d="M256,155 L304,184 L288,242 L224,242 L208,184Z" fill="#111" opacity="0.87"/>
    <path d="M208,184 L158,177 L133,228 L168,277 L208,242Z" fill="#111" opacity="0.87"/>
    <path d="M304,184 L354,177 L379,228 L344,277 L304,242Z" fill="#111" opacity="0.87"/>
    <path d="M168,277 L133,322 L158,371 L215,381 L238,335 L208,242Z" fill="#111" opacity="0.87"/>
    <path d="M344,277 L379,322 L354,371 L297,381 L274,335 L304,242Z" fill="#111" opacity="0.87"/>
    <path d="M238,335 L215,381 L256,399 L297,381 L274,335 L256,348Z" fill="#111" opacity="0.87"/>
    <!-- Ball rim -->
    <circle cx="256" cy="292" r="150" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="3"/>
    <!-- Ball shine -->
    <circle cx="218" cy="232" r="28" fill="rgba(255,255,255,0.32)"/>

    <!-- ===== TROPHY ===== -->
    <!-- Handles -->
    <path d="M196,188 Q150,188 150,228 Q150,265 196,268" fill="none" stroke="url(#cupG)" stroke-width="22" stroke-linecap="round" filter="url(#sh2)"/>
    <path d="M316,188 Q362,188 362,228 Q362,265 316,268" fill="none" stroke="url(#cupG)" stroke-width="22" stroke-linecap="round" filter="url(#sh2)"/>
    <!-- Cup body -->
    <path d="M196,162 L196,255 Q196,285 256,288 Q316,285 316,255 L316,162 Z" fill="url(#cupG)" filter="url(#sh2)"/>
    <!-- Top rim -->
    <rect x="187" y="152" width="138" height="18" rx="9" fill="#FFE55C" filter="url(#sh3)"/>
    <!-- Cup shine -->
    <path d="M213,168 L228,168 L225,278 L213,275Z" fill="rgba(255,255,255,0.28)"/>
    <!-- Stem -->
    <rect x="238" y="288" width="36" height="32" rx="4" fill="url(#stemG)"/>
    <!-- Base -->
    <rect x="208" y="318" width="96" height="16" rx="8" fill="url(#cupG)" filter="url(#sh3)"/>
    <rect x="200" y="330" width="112" height="12" rx="6" fill="#FFD700" filter="url(#sh3)"/>

    <!-- ===== 3 STARS ===== -->
    <!-- Left star (small) -->
    <g transform="translate(178,76) scale(0.72)" filter="url(#sh3)">
      <polygon points="0,-30 6.8,-10 28,-10 11.5,3.5 18.5,24 0,12 -18.5,24 -11.5,3.5 -28,-10 -6.8,-10" fill="#FFD700"/>
    </g>
    <!-- Center star (large) -->
    <g transform="translate(256,64)" filter="url(#sh3)">
      <polygon points="0,-34 7.8,-11 32,-11 13,4 20,27 0,14 -20,27 -13,4 -32,-11 -7.8,-11" fill="#FFD700"/>
    </g>
    <!-- Right star (small) -->
    <g transform="translate(334,76) scale(0.72)" filter="url(#sh3)">
      <polygon points="0,-30 6.8,-10 28,-10 11.5,3.5 18.5,24 0,12 -18.5,24 -11.5,3.5 -28,-10 -6.8,-10" fill="#FFD700"/>
    </g>
  </g>
</svg>
